name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - '*.cs'
      - 'build.ps1'
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the official runtime
        run: ./packaging/download-runtime.ps1
      - name: Build Windows installer and portable package
        run: ./build.ps1
      - name: Check docking animation regressions
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /codepage:65001 /target:exe /main:VerifyDockAnimation /out:.build\VerifyDockAnimation.exe /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll tests\VerifyDockAnimation.cs WidgetV2.cs WidgetCompact.cs CodexAccountReader.cs
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed.' }
          & .build\VerifyDockAnimation.exe $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'Dock animation checks failed.' }
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $match = [regex]::Match((Get-Content packaging\AssemblyInfo.cs -Raw), 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.0"\)')
          if (-not $match.Success) { throw 'Missing release version.' }
          $version = $match.Groups[1].Value
          $tag = 'v' + $version
          $notes = 'releases/' + $tag + '.md'
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Missing release notes.' }
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          if (@($existing | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Output "Release $tag already exists; bump the version for a new update."; exit 0
          }
          $assets = @("dist/CodexUsageWidget-Setup-$version-win-x64.exe", "dist/CodexUsageWidget-Portable-$version-win-x64.zip", 'dist/SHA256SUMS.txt')
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "codexQuotadisplay $version" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
